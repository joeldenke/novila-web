<!doctype html>
<html lang="{{lang}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{title}}</title>
  <meta name="description" content="{{description}}">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#0B110F">
  <link rel="canonical" href="{{canonical}}">
  <link rel="alternate" hreflang="en" href="{{alternate_en}}">
  <link rel="alternate" hreflang="sv" href="{{alternate_sv}}">
  <link rel="alternate" hreflang="x-default" href="{{alternate_en}}">
  <link rel="icon" type="image/png" href="/icon.png">
  <link rel="apple-touch-icon" href="/icon.png">
  <link rel="stylesheet" href="/style.css">
  <script>
    // The light of the visitor's hour, as in the app: dawn 05-10, day 10-17, dusk 17-22, night 22-05 (dusk until
    // 02 in June and July). It sets the start page's light and its horizon; nothing is stored or sent.
    (function () {
      var now = new Date(), h = now.getHours(), m = now.getMonth() + 1;
      var light = h >= 5 && h < 10 ? "dawn" : h >= 10 && h < 17 ? "day" : h >= 17 && h < 22 ? "dusk"
        : (m === 6 || m === 7) && (h >= 22 || h < 2) ? "dusk" : "night";
      var root = document.documentElement;
      root.setAttribute("data-light", light);
      root.style.setProperty("--now", ((h * 60 + now.getMinutes()) / 1440).toFixed(3));
      document.addEventListener("DOMContentLoaded", function () {
        document.querySelectorAll(".horizon").forEach(function (horizon) {
          var word = horizon.getAttribute("data-" + light);
          horizon.setAttribute("aria-label", horizon.getAttribute("data-label").replace("%s", word));
          horizon.querySelector(".horizon-now").textContent = word;
        });
      });
    })();
  </script>
</head>
<body class="page-{{page}}">
  <a class="skip" href="#content">{{skip}}</a>
  <header class="top">
    <div class="top-inner">
      <a class="brand" href="/{{home}}"><img src="/icon.png" alt="" width="28" height="28"><span>Novila</span></a>
      <nav class="top-links">
        <a href="/{{faq}}">{{faq_label}}</a>
        <a class="language" href="/{{switch}}" hreflang="{{switch_lang}}" lang="{{switch_lang}}">{{switch_label}}</a>
      </nav>
    </div>
  </header>
  <main id="content">
{{body}}
  </main>
  <footer class="bottom">
    <nav>
      <a href="/{{home}}">{{home_label}}</a>
      <a href="/{{faq}}">{{faq_label}}</a>
      <a href="/{{privacy}}">{{privacy_label}}</a>
      <a href="/{{terms}}">{{terms_label}}</a>
      <a href="mailto:{{contact}}">{{contact_label}}: {{contact}}</a>
    </nav>
    <p>{{footer}}</p>
  </footer>
</body>
</html>
